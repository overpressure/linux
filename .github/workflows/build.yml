# SPDX-License-Identifier: GPL-2.0-only
# Every headset's kernel this tree makes, built with overpressure's tooling (its build container) and the
# headset's build-tree.sh (its repository overpressure/<headset>, dropped into overpressure's devices/),
# after the headset's own tests (.github/scripts/headsets.sh says which):
#
# - a pull request into a headset's branch builds its merge;
# - a pull request into a layer without a headset (common/, sm8250/) builds every headset's branch built
#   on that layer (.github/layers) with the pull request's merge merged in, in the runner, not pushed;
# - a layer's pull requests, which the Layers workflow opens with the workflow's own token (one that starts
#   no workflow), are built by one run the Layers workflow starts with `head` (the branch that moves up), on
#   that branch itself, or on its one layer for valve/7.2, whose tree has no workflows: every headset's
#   branch built on it is built with `head` merged in, and the run sets the status `ci` on `head`'s commit,
#   the head of each of those pull requests, once for all of them;
# - a headset's branch whose repository has no kernel/build-tree.sh yet builds nothing, and passes;
# - a push to a headset's branch builds it; a tag (<headset>/<version>-<n>) is released with the kernel the
#   push build of its commit made, and builds only when that commit has no successful push build.
#
# The required check is `ci`: the gate job, which passes only when every job before it did, or the status
# a run with `head` sets. Checks belong to a commit, and a layer's pull request has the layer's own head
# commit as its head, so a run on that commit with nothing to build would pass the pull request's check
# for it. Pushes to the layers without a headset therefore start no run (the push branches leave them out,
# and headsets.sh refuses a push to one), and a run with `head`, which runs on its base's commit, names its
# gate job otherwise: only a pull request's own run, a headset branch's, or the status on `head` gives a
# commit its `ci`.
#
# Each content is built once. A check of a change (a pull request, a run with `head`) is keyed by the
# kernel's sources (the tree without .github, the CI), the headset's kernel/ folder and the build image's pin:
# the layers' pull requests build the same tree as the pull request before them and find its build. A key
# built before (by this repository, never a fork) is downloaded instead of built again. A push to a headset's
# branch compiles anyway, through ccache: GitHub keeps a run's cache for its own branch, and only the default
# branch's is read by every pull request, so the push after a merge is what keeps that cache current. A
# tag's own build, where it needs one, is keyed by the commit instead (uname -v names it) and starts clean.
# The kernel's configuration signs modules with a key each build generates, so no two builds of a commit
# give the same Image: a release is one build, not checked against a second.
name: Build

on:
  push:
    # The headsets' branches; the layers without a headset build in their pull requests (see above).
    branches: ["*/[0-9]*", "!valve/*", "!common/*", "!sm8250/*"]
    tags: ["*/*-*"]
  pull_request:
  workflow_dispatch:
    inputs:
      head:
        description: "the head of a layer's pull requests (a branch): built merged into each headset branch on this ref"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.head }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write # the pending ci on a layer pull request's head
      actions: read # a tag's push build
    outputs:
      headsets: ${{ steps.plan.outputs.headsets }}
      builds: ${{ steps.plan.outputs.builds }}
      device: ${{ steps.plan.outputs.device }}
      tooling: ${{ steps.plan.outputs.tooling }}
      tested: ${{ steps.plan.outputs.tested }}
      pushed: ${{ steps.plan.outputs.pushed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: .github
      - name: What to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ inputs.head }}
        run: |
          tested=""
          case $EVENT in
          pull_request) headsets=$(bash .github/scripts/headsets.sh "$BASE") ;;
          push) headsets=$(bash .github/scripts/headsets.sh --self "$GITHUB_REF_NAME") ;;
          *)
            headsets=$(bash .github/scripts/headsets.sh "$GITHUB_REF_NAME")
            if [ -n "$HEAD" ]; then
              # A layer pull request's head, merged into every headset branch on this base, its own included.
              headsets=$(echo "$headsets" | jq -c 'map(.merge = true)')
              tested=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD" --jq .sha)
              gh api "repos/$GITHUB_REPOSITORY/statuses/$tested" --silent -f state=pending -f context=ci \
                -f description="building $HEAD into $GITHUB_REF_NAME's headsets" \
                -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
            ;;
          esac
          builds='["a"]'
          # A tag's kernel is its commit's push build, the newest that passed on the headset's branch.
          pushed=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            pushed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?event=push&status=success&head_sha=$GITHUB_SHA" \
              --jq '[.workflow_runs[] | select(.head_branch | test("^[^/]+/[0-9.]+$"))][0].id // empty')
            echo "the push build of ${GITHUB_SHA:0:12}: ${pushed:-none, so this tag builds}"
          fi
          tooling=$(gh api repos/overpressure/overpressure/commits/main --jq .sha)
          {
            echo "headsets=$headsets"
            echo "builds=$builds"
            echo "pushed=$pushed"
            echo "device=$(echo "$headsets" | jq -r '.[0].device')"
            echo "tooling=$tooling"
            echo "tested=$tested"
          } >> "$GITHUB_OUTPUT"
          echo "$headsets" | jq -r '.[] | "\(.device): \(.branch)\(if .merge then ", the tested commit merged in" else "" end), recipe \(.recipe)"'
          echo "overpressure: $tooling"

  kernel:
    needs: plan
    # Nothing to build: a headset's branch whose repository has no kernel/build-tree.sh yet.
    if: needs.plan.outputs.headsets != '[]'
    name: kernel ${{ matrix.headset.device }} (${{ matrix.build }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read # an earlier build of the same content
    strategy:
      fail-fast: false
      matrix:
        headset: ${{ fromJSON(needs.plan.outputs.headsets) }}
        build: ${{ fromJSON(needs.plan.outputs.builds) }}
    env:
      DEVICE: ${{ matrix.headset.device }}
    steps:
      - name: overpressure's tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: overpressure/overpressure
          ref: ${{ needs.plan.outputs.tooling }}
          path: overpressure
      - name: The headset
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.headset.device }}
          ref: ${{ matrix.headset.recipe }}
          path: overpressure/devices/${{ matrix.headset.device }}
      # The run's own scripts: the tree under test may have none (valve/7.2, a layer pull request's head).
      - name: This run's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .ci
          fetch-depth: 1
          sparse-checkout: .github
      - name: This tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: overpressure/out/linux
          ref: ${{ needs.plan.outputs.tested }} # a layer pull request's head; else the run's commit
          fetch-depth: 1
      - name: Merged into ${{ matrix.headset.branch }}
        id: merge
        if: matrix.headset.merge
        working-directory: overpressure/out/linux
        env:
          BRANCH: ${{ matrix.headset.branch }}
        run: |
          tested=$(git rev-parse HEAD)
          bash "$GITHUB_WORKSPACE/.ci/.github/scripts/history.sh" --merge "$BRANCH" "$tested" > /dev/null
          git checkout -q -B headset "origin/$BRANCH"
          # The same merge gives the same commit, so a second run finds the first one's build.
          GIT_AUTHOR_DATE=$(git show -s --format=%cI "$tested")
          export GIT_AUTHOR_DATE GIT_COMMITTER_DATE=$GIT_AUTHOR_DATE
          export GIT_AUTHOR_NAME=overpressure GIT_COMMITTER_NAME=overpressure
          export GIT_AUTHOR_EMAIL=ci@overpressure.invalid GIT_COMMITTER_EMAIL=ci@overpressure.invalid
          if git merge -q --no-ff -m "Merge ${tested:0:12} into $BRANCH (a build, not pushed)" "$tested"; then
            echo "$BRANCH with ${tested:0:12} merged in: $(git rev-parse HEAD)"
          else
            git merge --abort
            echo "::warning::${tested:0:12} conflicts with $BRANCH: not built here; the conflict is resolved, and built, in the pull request that brings it into $BRANCH"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi
      - name: The content's key
        id: key
        if: steps.merge.outputs.conflict != 'true'
        env:
          TAG: ${{ github.ref_type == 'tag' }}
        run: |
          # A tag's build by its commit (what it releases names it); every other build by the kernel's sources:
          # the tree's top-level entries but .github, which holds the CI and none of what the kernel is built from.
          if [ "$TAG" = true ]; then
            content=$(git -C overpressure/out/linux rev-parse HEAD) kind=release
          else
            content=$(git -C overpressure/out/linux ls-tree HEAD | grep -v "$(printf '\t').github$" | sha256sum | cut -c1-64)
            kind=check
          fi
          recipe=$(git -C "overpressure/devices/$DEVICE" rev-parse HEAD:kernel)
          image=$(git -C overpressure rev-parse HEAD:overpressure/linux.py)
          key=$(echo "$content $recipe $image" | sha256sum | cut -c1-32)
          echo "name=$kind-$DEVICE-$key" >> "$GITHUB_OUTPUT"
      - name: An earlier build of the same content
        id: earlier
        # Not for a push to a branch: it compiles, and so refills its branch's ccache (see the top). A tag takes
        # its commit's push build.
        if: steps.key.outputs.name && matrix.build == 'a' && (github.event_name != 'push' || github.ref_type == 'tag')
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.key.outputs.name }}
          PUSHED: ${{ needs.plan.outputs.pushed }}
          OURS: "[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == ${{ github.repository_id }})][0].id // empty"
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            id=""
            [ -z "$PUSHED" ] || id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUSHED/artifacts" \
              --jq "[.artifacts[] | select((.expired | not) and (.name | startswith(\"check-$DEVICE-\")))][0].id // empty")
            NAME="the push build's kernel (run $PUSHED)"
          else
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=30" --jq "$OURS")
          fi
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > earlier.zip
            mkdir -p overpressure/out/kernel && unzip -q earlier.zip -d overpressure/out/kernel && rm earlier.zip
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$NAME: built before (artifact $id)"
          fi
      - name: The headset's own tests
        if: steps.key.outputs.name && steps.earlier.outputs.found != 'true'
        run: |
          tests=overpressure/out/linux/tools/testing/overpressure/$DEVICE/run.sh
          if [ -f "$tests" ]; then bash "$tests"; else echo "no tests of its own"; fi
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        if: steps.key.outputs.name && steps.earlier.outputs.found != 'true'
        with:
          version: "0.9.26"
      - name: The build container
        if: steps.key.outputs.name && steps.earlier.outputs.found != 'true'
        working-directory: overpressure
        run: |
          uv sync --locked
          uv run python -m overpressure container pull
      # A check build compiles through ccache (build-tree.sh's CCACHE_DIR), whose objects carry over from the
      # newest cache this run may read: its own branch's, its base's, the default branch's. A tag's two
      # builds start clean: they are the test that the kernel is reproducible. A headset's own cache comes
      # first. A new headset, which has none yet, starts from the cache of another headset on its SoC's layer
      # (.github/layers) that the run may read, such as the default branch's: the same compiler and paths, so
      # every file both configurations compile alike is a hit. The build's ccache statistics show how many.
      - name: The headsets on its SoC
        id: caches
        if: steps.key.outputs.name && steps.earlier.outputs.found != 'true' && github.ref_type != 'tag'
        env:
          BRANCH: ${{ matrix.headset.branch }}
        run: |
          soc=$(awk -v b="$BRANCH" '!/^#/ && $2 == b {print $1}' .ci/.github/layers)
          {
            echo "keys<<EOF"
            echo "ccache-$DEVICE-"
            awk -v s="$soc" -v b="$BRANCH" '!/^#/ && $1 == s && $2 != b {split($2, p, "/"); print "ccache-" p[1] "-"}' .ci/.github/layers
            echo "EOF"
          } | tee -a "$GITHUB_OUTPUT"
      - name: The compiled objects of earlier builds
        if: steps.key.outputs.name && steps.earlier.outputs.found != 'true' && github.ref_type != 'tag'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: overpressure/out/ccache
          key: ccache-${{ matrix.headset.device }}-${{ github.run_id }}
          restore-keys: ${{ steps.caches.outputs.keys }}
      - name: The kernel
        if: steps.key.outputs.name && steps.earlier.outputs.found != 'true'
        working-directory: overpressure
        env:
          CCACHE: ${{ github.ref_type != 'tag' && '/work/out/ccache' || '' }}
        run: |
          uv run python -m overpressure container run -- \
            env ${CCACHE:+CCACHE_DIR="$CCACHE"} \
            bash "devices/$DEVICE/kernel/build-tree.sh" out/linux /var/tmp/kernel out/kernel
          cat out/kernel/build.json
      - name: The compiled objects, for the next build
        if: always() && steps.key.outputs.name && steps.earlier.outputs.found != 'true' && github.ref_type != 'tag'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: overpressure/out/ccache
          key: ccache-${{ matrix.headset.device }}-${{ github.run_id }}
      - name: The tooling it was built with
        if: steps.key.outputs.name && steps.earlier.outputs.found != 'true'
        run: |
          jq -n --arg device "$DEVICE" \
            --arg overpressure "$(git -C overpressure rev-parse HEAD)" \
            --arg headset "$(git -C "overpressure/devices/$DEVICE" rev-parse HEAD)" \
            '{"overpressure/overpressure": $overpressure, ("overpressure/" + $device): $headset}' \
            > overpressure/out/kernel/tooling.json
      - name: Kept for the next run
        if: steps.key.outputs.name && matrix.build == 'a' && steps.earlier.outputs.found != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.key.outputs.name }}
          path: overpressure/out/kernel
          if-no-files-found: error
      - name: Its files
        if: steps.key.outputs.name && github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-${{ matrix.headset.device }}-${{ matrix.build }}
          path: overpressure/out/kernel
          if-no-files-found: error

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: The shell scripts (shellcheck)
        run: |
          shellcheck --version | sed -n 2p
          git ls-files -z -- '.github/scripts/*.sh' 'tools/testing/overpressure/*.sh' | xargs -0 -r shellcheck
      - name: The workflows (actionlint)
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive=$RUNNER_TEMP/actionlint.tar.gz
          curl -fsSLo "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      # Advisory for now: the pull request's own commits, as the kernel's maintainers would see them. A
      # layer's pull request carries commits checked on their way into the layer, and Valve's.
      - name: The pull request's commits (checkpatch, advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if grep -v '^#' .github/layers | cut -d' ' -f1 | grep -qxF "$HEAD_REF"; then
            echo "$HEAD_REF is a layer: its commits were checked on their way into it"
            exit 0
          fi
          base=$(bash .github/scripts/history.sh "$BASE" "$HEAD_SHA")
          git format-patch -q -o "$RUNNER_TEMP/patches" --no-merges "$base..$HEAD_SHA"
          shopt -s nullglob
          patches=("$RUNNER_TEMP"/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "no commits of its own"
            exit 0
          fi
          scripts/checkpatch.pl --strict --no-signoff --show-types --ignore FILE_PATH_CHANGES "${patches[@]}"

  release:
    needs: [plan, kernel]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DEVICE: ${{ needs.plan.outputs.device }}
    steps:
      # By name and into its own folder: a single artifact found by a pattern lands in the workspace itself.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-${{ needs.plan.outputs.device }}-a
          path: kernel-${{ needs.plan.outputs.device }}-a
      - name: The history since the headset's previous tag
        run: |
          # Commits only, no trees: Valve's branch and the headset's tags, with all their history.
          git clone -q --bare --filter=tree:0 --single-branch --branch valve/7.2 \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" history.git
          git -C history.git fetch -q origin "+refs/tags/$DEVICE/*:refs/tags/$DEVICE/*"
      - name: The release
        working-directory: kernel-${{ needs.plan.outputs.device }}-a
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PUSHED: ${{ needs.plan.outputs.pushed }}
        run: |
          camera=$(jq -r .camera_table build.json)
          if [ "$camera" != none ]; then
            echo "this kernel compiles the camera table in ($camera): a release needs the driver to load it" >&2
            exit 1
          fi
          # The tooling's commits that built these files (tooling.json, kept with the build) go into build.json.
          tooling='{}'
          [ ! -f tooling.json ] || tooling=$(cat tooling.json)
          jq --argjson tooling "$tooling" '. + {tooling_commits: $tooling}' build.json > ../build.json
          mv ../build.json build.json
          rm -f tooling.json
          sha256sum -- * > SHA256SUMS
          cat build.json SHA256SUMS

          git=(git -C ../history.git)
          # The previous release, not the previous tag: a tag whose release failed has none, and its changes
          # belong to this one.
          prev=$({ gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName \
            --jq ".[].tagName | select(startswith(\"$DEVICE/\"))"; echo "$TAG"; } |
            sort -uV | grep -B1 -xF "$TAG" | grep -vxF "$TAG" || true)
          valve_now=$("${git[@]}" merge-base "$TAG" valve/7.2)
          {
            if [ -n "$PUSHED" ]; then
              echo "Built from ${GITHUB_SHA} by overpressure's tooling, in the push build of the headset's branch" \
                "($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$PUSHED)."
            else
              echo "Built from ${GITHUB_SHA} by overpressure's tooling, in this tag's run."
            fi
            echo
            echo "Tooling:"
            echo
            jq -r '.tooling_commits | if length == 0 then "- not recorded" else to_entries[] |
              "- [\(.key)@\(.value[0:12])](https://github.com/\(.key)/commit/\(.value))" end' build.json
            echo
            if [ -n "$prev" ]; then
              valve_then=$("${git[@]}" merge-base "$prev" valve/7.2)
              if [ "$valve_then" != "$valve_now" ]; then
                echo "Valve's kernel: ${valve_then:0:12} → ${valve_now:0:12}" \
                  "($("${git[@]}" rev-list --count "$valve_then..$valve_now") commits)"
              else
                echo "Valve's kernel: ${valve_now:0:12}, as in $prev"
              fi
              echo
              echo "Changes since $prev:"
              echo
              changes=$("${git[@]}" log --no-merges --abbrev=12 --format='- %h %s' "$prev..$TAG" ^valve/7.2)
              [ -n "$changes" ] || changes="- none: only merges"
              echo "$changes"
            else
              echo "Valve's kernel: ${valve_now:0:12}"
            fi
            echo
            echo '```'
            jq -r .banner build.json
            cat SHA256SUMS
            echo '```'
          } > ../notes.md
          cat ../notes.md
          # GitHub marks one release of the repository the latest: the newest, of whichever headset.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "$TAG" --notes-file ../notes.md -- *

  ci:
    # The required check (see the top): fails unless every job before it succeeded, the release only on tags.
    # A run with `head` runs on its base's commit: its gate is named otherwise, and its verdict goes to `head`.
    name: ${{ inputs.head && format('verdict for {0}', inputs.head) || 'ci' }}
    if: always()
    needs: [plan, kernel, lint, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write # the ci on a layer pull request's head
    steps:
      - name: Every job
        id: verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          RELEASE: ${{ github.ref_type == 'tag' && 'success' || 'skipped' }}
          # The kernel job is skipped only when there is nothing to build (see it): then that passes.
          KERNEL: ${{ needs.plan.outputs.headsets == '[]' && 'skipped' || 'success' }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e --arg release "$RELEASE" --arg kernel "$KERNEL" \
            'all(to_entries[]; .value.result == (if .key == "release" then $release elif .key == "kernel" then $kernel else "success" end))' > /dev/null; then
            echo "state=success" >> "$GITHUB_OUTPUT"
          else
            echo "state=failure" >> "$GITHUB_OUTPUT"
          fi
      - name: The layer pull request's ci
        if: always() && needs.plan.outputs.tested
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED: ${{ needs.plan.outputs.tested }}
          STATE: ${{ steps.verdict.outputs.state || 'failure' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$TESTED" --silent -f state="$STATE" -f context=ci \
            -f description="its merge into $GITHUB_REF_NAME's headsets: $STATE" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: The verdict
        env:
          STATE: ${{ steps.verdict.outputs.state }}
        run: '[ "$STATE" = success ]'
