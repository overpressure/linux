# SPDX-License-Identifier: GPL-2.0-only
# A change moves up the layers by pull request (.github/layers, .github/scripts/layers.sh): when a
# branch moves, every layer built on it that lacks its commits gets a pull request from it, unless one
# is open. The Valve workflow starts this for valve/7.2, whose own tree has no workflows.
#
# The workflow's own token opens the pull requests, and a pull request opened with it starts no workflow:
# layers.sh starts each one's Build itself (a workflow_dispatch, which that token may start) on the pull
# request's base with its head, and that run sets the status ci on the head's commit (build.yml).
name: Layers

on:
  push:
    branches: ["*/[0-9]*"]
  workflow_dispatch:
    inputs:
      from:
        description: "the branch whose commits move up (valve/7.2, common/7.2, ...)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: layers-${{ inputs.from || github.ref_name }}
  cancel-in-progress: false

jobs:
  layers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # the pull requests up the layers
      actions: write # their Build runs
    env:
      FROM: ${{ inputs.from || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Pull requests from ${{ env.FROM }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/layers.sh "$FROM"
