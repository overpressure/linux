# SPDX-License-Identifier: GPL-2.0-only
# A change moves up the layers by pull request (.github/layers, .github/scripts/layers.sh): when a
# branch moves, every layer built on it that lacks its commits gets a pull request from it, unless one
# is open. The Valve workflow starts this for valve/7.2, whose own tree has no workflows.
#
# The pull requests are opened with the Layers app's token (secrets LAYERS_APP_ID and
# LAYERS_APP_PRIVATE_KEY, .github/README.md): one opened with the workflow's own token starts no
# workflow, so its Build would never run. Without the app's secrets the workflow's token opens them, and
# their Build is started by hand.
name: Layers

on:
  push:
    branches: ["*/[0-9]*"]
  workflow_dispatch:
    inputs:
      from:
        description: "the branch whose commits move up (valve/7.2, common/7.2, ...)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: layers-${{ inputs.from || github.ref_name }}
  cancel-in-progress: false

jobs:
  layers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # the pull requests up the layers, when there is no app
    env:
      APP_ID: ${{ secrets.LAYERS_APP_ID }}
      FROM: ${{ inputs.from || github.ref_name }}
    steps:
      - name: The Layers app's token
        id: app
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.LAYERS_APP_ID }} # its client ID or its app ID
          private-key: ${{ secrets.LAYERS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Without the Layers app
        if: env.APP_ID == ''
        run: |
          echo "::warning::No Layers app (secrets LAYERS_APP_ID, LAYERS_APP_PRIVATE_KEY): a pull request opened now starts no Build; start it by hand (re-run its failed Build run, or close and reopen the pull request)"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Pull requests from ${{ env.FROM }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: bash .github/scripts/layers.sh "$FROM"
