# SPDX-License-Identifier: GPL-2.0-only
# Valve's kernel, followed (.github/scripts/valve.sh). Weekly, and on demand: valve/7.2 moves forward to
# the newest commit of Valve's public branch (through the evlaV mirror), and the Layers workflow opens
# the pull request that brings it into common/7.2. A rewritten Valve branch fails the run.
name: Valve

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valve
  cancel-in-progress: false

jobs:
  valve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # valve/7.2, forward only
      actions: write # the Layers workflow
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Valve's newest commit
        run: bash .github/scripts/valve.sh
