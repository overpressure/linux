# SPDX-License-Identifier: GPL-2.0-only
# Valve's kernel, followed (.github/scripts/valve-update.sh). Weekly, and on demand: the layers rebased
# onto Valve's newest commit of its public branch (through the evlaV mirror) on <layer>-next branches,
# proposed as a pull request per headset, whose branch is built. A conflict fails the run and names the
# commit. "land", started by hand after the review, moves the layers and valve/7.2 to the proposal and
# tags Valve's commit; it releases nothing.
name: Valve

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      action:
        description: "propose: rebase onto Valve's newest; land: move the layers to the proposal"
        type: choice
        options: [propose, land]
        default: propose

permissions:
  contents: read

concurrency:
  group: valve
  cancel-in-progress: false

jobs:
  valve:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # the -next branches, the layers, Valve's tag
      pull-requests: write # the proposal
      actions: write # the proposal's build
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_COMMITTER_NAME: overpressure
      GIT_COMMITTER_EMAIL: overpressure@pico4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Valve's kernel, ${{ inputs.action || 'propose' }}
        run: bash .github/scripts/valve-update.sh "${{ inputs.action || 'propose' }}"
